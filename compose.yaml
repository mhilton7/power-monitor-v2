name: power-meter-v2-local

x-common-environment: &common-environment
  PM_ENV: production
  PM_DATABASE_HOST: postgres
  PM_DATABASE_PORT: "5432"
  PM_DATABASE_NAME: powermeter
  PM_LOG_DIR: /data/logs
  PM_LOG_RETENTION_DAYS: "90"
  PM_BACKUP_STATUS_DIR: /data/backup-status
  PM_PUBLIC_ORIGIN: https://power-monitor.home.arpa:8443
  PM_TIMEZONE: America/Los_Angeles
  TZ: UTC

services:
  postgres:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    environment:
      POSTGRES_DB: powermeter
      POSTGRES_USER: pm_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_bootstrap_password
      - postgres_migrator_password
      - postgres_api_password
      - postgres_worker_password
      - postgres_backup_password
      - postgres_restore_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-powermeter-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -q -U pm_api -d powermeter"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${PM_API_IMAGE:-power-meter-v2-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, backend.app.migrate]
    environment:
      <<: *common-environment
      PM_SERVICE_ROLE: migrate
      PM_DATABASE_USER: pm_migrator
      PM_DATABASE_PASSWORD_FILE: /run/secrets/postgres_migrator_password
    secrets: [postgres_migrator_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
    restart: "no"

  api:
    image: ${PM_API_IMAGE:-power-meter-v2-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *common-environment
      PM_SERVICE_ROLE: api
      PM_DATABASE_USER: pm_api
      PM_DATABASE_PASSWORD_FILE: /run/secrets/postgres_api_password
      PM_SESSION_SECRET_FILE: /run/secrets/session_secret
      PM_FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      PM_OTA_MANIFEST_KEY_FILE: /run/secrets/ota_manifest_key
    secrets:
      - postgres_api_password
      - session_secret
      - field_encryption_key
      - ota_manifest_key
    volumes:
      - backup-status:/data/backup-status:ro
      - application-logs:/data/logs
      - firmware:/data/firmware
      - rate-artifacts:/data/rate-source-artifacts
      - bill-rate-artifacts:/data/bill-rate-source-artifacts
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database, application]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: ${PM_API_IMAGE:-power-meter-v2-api:local}
    command: [python, -m, worker.app.main]
    environment:
      <<: *common-environment
      PM_SERVICE_ROLE: worker
      PM_DATABASE_USER: pm_worker
      PM_DATABASE_PASSWORD_FILE: /run/secrets/postgres_worker_password
      PM_WORKER_HEALTH_FILE: /tmp/worker-health.json
    secrets: [postgres_worker_password]
    volumes:
      - backup-status:/data/backup-status:ro
      - application-logs:/data/logs
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database]
    healthcheck:
      test: [CMD, python, -c, "import json,pathlib,time; p=pathlib.Path('/tmp/worker-health.json'); d=json.loads(p.read_text()); assert d['state']=='healthy' and time.time()-__import__('datetime').datetime.fromisoformat(d['completed_at']).timestamp()<60"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    image: ${PM_FRONTEND_IMAGE:-power-meter-v2-frontend:local}
    build:
      context: frontend
      dockerfile: Dockerfile
    networks: [application]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  gateway:
    image: ${PM_GATEWAY_IMAGE:-power-meter-v2-gateway:local}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    user: "1000:1000"
    environment: {PM_HOSTNAME: power-monitor.home.arpa}
    ports: ["8443:8443"]
    secrets:
      - source: tls_cert
        target: tls_cert
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: tls_key
        target: tls_key
        uid: "1000"
        gid: "1000"
        mode: 0440
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-logs:/var/log/powermeter
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    networks: [application]
    restart: unless-stopped

  backup:
    image: ${PM_BACKUP_IMAGE:-power-meter-v2-backup:local}
    build:
      context: .
      dockerfile: backup/Dockerfile
    environment:
      PM_DATABASE_HOST: postgres
      PM_DATABASE_PORT: "5432"
      PM_DATABASE_NAME: powermeter
      PM_DATABASE_USER: pm_backup
      PM_DATABASE_PASSWORD_FILE: /run/secrets/postgres_backup_password
      PM_RESTORE_DATABASE_USER: pm_restore_test
      PM_RESTORE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_restore_password
      PM_BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_key
      PM_BACKUP_DIR: /backups
    secrets: [postgres_backup_password, postgres_restore_password, backup_key]
    volumes:
      - backups:/backups
      - backup-status:/backups/status
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
    restart: unless-stopped

networks:
  database: {internal: true}
  application: {}

volumes:
  postgres-data: {}
  firmware: {}
  rate-artifacts: {}
  bill-rate-artifacts: {}
  backup-status: {}
  application-logs: {}
  backups: {}
  gateway-logs: {}
  caddy-data: {}
  caddy-config: {}

secrets:
  postgres_bootstrap_password: {file: ./.secrets/postgres_bootstrap_password}
  postgres_migrator_password: {file: ./.secrets/postgres_migrator_password}
  postgres_api_password: {file: ./.secrets/postgres_api_password}
  postgres_worker_password: {file: ./.secrets/postgres_worker_password}
  postgres_backup_password: {file: ./.secrets/postgres_backup_password}
  postgres_restore_password: {file: ./.secrets/postgres_restore_password}
  session_secret: {file: ./.secrets/session_secret}
  field_encryption_key: {file: ./.secrets/field_encryption_key}
  ota_manifest_key: {file: ./.secrets/ota_manifest_key}
  backup_key: {file: ./.secrets/backup_key}
  tls_cert: {file: ./.secrets/tls_cert.pem}
  tls_key: {file: ./.secrets/tls_key.pem}
